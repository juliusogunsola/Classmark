<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Attendance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <h1>📋 Class Attendance</h1>
    </header>

    <!-- Stats Bar -->
    <section class="stats-bar" aria-label="Attendance summary">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card present">
        <span class="stat-value" id="stat-present">0</span>
        <span class="stat-label">Present</span>
      </div>
      <div class="stat-card absent">
        <span class="stat-value" id="stat-absent">0</span>
        <span class="stat-label">Absent</span>
      </div>
    </section>

    <!-- Add / Edit Form -->
    <section class="form-card" aria-label="Attendance form">
      <h2 id="form-title">Add Record</h2>

      <div id="form-error" class="form-error" role="alert" aria-live="polite" hidden></div>

      <div class="form-group">
        <label for="input-name">Student Name</label>
        <input
          type="text"
          id="input-name"
          placeholder="e.g. Jane Smith"
          autocomplete="off"
          maxlength="80"
        />
      </div>

      <div class="form-group">
        <label for="input-date">Date</label>
        <input type="date" id="input-date" />
      </div>

      <div class="form-group">
        <label>Status</label>
        <div class="status-toggle" role="group" aria-label="Attendance status">
          <button
            type="button"
            id="btn-present"
            class="toggle-btn active"
            aria-pressed="true"
            data-status="Present"
          >✅ Present</button>
          <button
            type="button"
            id="btn-absent"
            class="toggle-btn"
            aria-pressed="false"
            data-status="Absent"
          >❌ Absent</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" id="btn-save" class="btn btn-primary">Save Record</button>
        <button type="button" id="btn-cancel" class="btn btn-secondary" hidden>Cancel</button>
      </div>
    </section>

    <!-- Search & Filters -->
    <section class="filter-card" aria-label="Search and filter">
      <div class="search-row">
        <input
          type="search"
          id="search-input"
          placeholder="🔍 Search by student name…"
          autocomplete="off"
        />
      </div>
      <div class="filter-row">
        <div class="filter-group">
          <label for="filter-date">Filter by date</label>
          <input type="date" id="filter-date" />
        </div>
        <div class="filter-group">
          <label for="filter-status">Filter by status</label>
          <select id="filter-status">
            <option value="All">All</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
          </select>
        </div>
        <button type="button" id="btn-clear-filters" class="btn btn-ghost">Clear filters</button>
      </div>
    </section>

    <!-- Records List -->
    <section class="records-section" aria-label="Attendance records">
      <div id="records-list"></div>
    </section>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal">
      <h3 id="modal-title">Delete Record?</h3>
      <p id="modal-message">Are you sure you want to delete this record? This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" id="btn-modal-confirm" class="btn btn-danger">Yes, Delete</button>
        <button type="button" id="btn-modal-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
